<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Goal 工作台</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #17191e;
    --panel: #20232a;
    --panel-2: #282c35;
    --panel-3: #303642;
    --border: #373d48;
    --text: #e8eaed;
    --muted: #929aa7;
    --accent: #4a9eff;
    --accent-soft: rgba(74, 158, 255, .14);
    --danger: #ff6868;
    --ok: #50c878;
    --warning: #f0b35b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  button, input, textarea { font: inherit; }
  button {
    min-height: 34px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    background: var(--panel-2);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .42; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--border); }
  button.primary { border-color: var(--accent); background: var(--accent); color: white; }
  button.danger { color: var(--danger); }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  input, textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 7px;
    outline: none;
    background: #191c22;
    color: var(--text);
    padding: 8px 10px;
  }
  input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  textarea { resize: vertical; }
  header {
    height: 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 0, 0, .1);
  }
  header h1 { margin: 0; font-size: 16px; }
  .header-hint { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .status { min-width: 82px; text-align: right; color: var(--muted); font-size: 12px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  .layout {
    height: calc(100vh - 52px);
    display: grid;
    grid-template-columns: 290px minmax(0, 1fr);
    min-height: 0;
  }
  aside {
    min-height: 0;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: rgba(0, 0, 0, .06);
  }
  .side-section + .side-section { border-top: 1px solid var(--border); }
  .side-head {
    position: sticky;
    top: 0;
    z-index: 2;
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: var(--bg);
    border-bottom: 1px solid rgba(255, 255, 255, .04);
  }
  .side-title {
    flex: 1;
    color: var(--muted);
    font-size: 12px;
    font-weight: 750;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .count { color: var(--muted); font-size: 11px; }
  .icon-button { min-width: 30px; width: 30px; min-height: 30px; padding: 0; font-size: 18px; }
  .item {
    width: 100%;
    min-height: 54px;
    padding: 9px 12px;
    display: block;
    text-align: left;
    border: 0;
    border-bottom: 1px solid rgba(255, 255, 255, .04);
    border-radius: 0;
    background: transparent;
  }
  .item:hover { background: var(--panel); border-color: rgba(255, 255, 255, .04); }
  .item.active { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
  .item-title { display: block; overflow: hidden; color: var(--text); font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  .item.active .item-title { color: var(--accent); }
  .item-meta { display: block; margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .family-item {
    width: 100%;
    min-height: 46px;
    padding: 9px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 0;
    border-bottom: 1px solid rgba(255, 255, 255, .04);
    border-radius: 0;
    background: transparent;
    text-align: left;
  }
  .family-item:hover, .family-item.open { background: var(--panel); border-color: rgba(255, 255, 255, .04); }
  .family-item.active-family .item-title { color: var(--accent); }
  .family-caret { width: 14px; color: var(--muted); font-size: 11px; text-align: center; }
  .family-count { color: var(--muted); font-size: 11px; }
  .scenario-list { background: rgba(0, 0, 0, .12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025); }
  .item.scenario-item { min-height: 48px; padding-left: 34px; }
  .side-empty { padding: 18px 12px; color: var(--muted); font-size: 12px; }
  main { min-width: 0; min-height: 0; overflow-y: auto; padding: 22px; }
  .card {
    width: min(100%, 980px);
    margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .16);
  }
  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }
  .card-heading { min-width: 0; flex: 1; }
  .card-heading h2 { margin: 0; overflow-wrap: anywhere; font-size: 20px; }
  .eyebrow { margin-bottom: 4px; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
  .meta { margin-top: 5px; color: var(--muted); font-size: 12px; }
  .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .card-body { padding: 20px; }
  .section + .section { margin-top: 22px; }
  .section-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .readonly-body {
    min-height: 220px;
    margin: 0;
    padding: 14px;
    overflow-wrap: anywhere;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #191c22;
    color: var(--text);
    font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
  }
  .variable-list { display: grid; gap: 10px; }
  .variable-readonly, .variable-edit {
    display: grid;
    grid-template-columns: minmax(140px, 220px) minmax(0, 1fr);
    gap: 10px;
    align-items: start;
  }
  .variable-name {
    padding-top: 8px;
    overflow-wrap: anywhere;
    color: var(--accent);
    font: 650 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .variable-value {
    min-height: 38px;
    max-height: 220px;
    overflow: auto;
    margin: 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #191c22;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
  }
  .variable-edit { grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) auto; }
  .variable-edit textarea { min-height: 58px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .editable-field { position: relative; min-width: 0; }
  .editable-field textarea { padding-right: 66px; }
  .copy-variable-value { min-height: 72px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .large-variable .copy-variable-value { min-height: 220px; }
  .expand-editor {
    position: absolute;
    top: 6px;
    right: 6px;
    min-height: 28px;
    padding: 3px 8px;
    border-color: rgba(255, 255, 255, .12);
    background: var(--panel-3);
    color: var(--muted);
    font-size: 11px;
  }
  .row-actions { display: flex; gap: 5px; }
  .row-actions button { min-width: 32px; padding: 4px 8px; }
  .body-editor { min-height: 48vh; font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .field-label { display: block; margin: 0 0 6px; color: var(--muted); font-size: 12px; }
  .title-field { font-size: 18px; font-weight: 700; }
  .notice {
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 1px solid rgba(74, 158, 255, .35);
    border-radius: 8px;
    background: var(--accent-soft);
    color: #cfe5ff;
    font-size: 12px;
  }
  .notice.error { border-color: rgba(255, 104, 104, .4); background: rgba(255, 104, 104, .1); color: #ffc3c3; }
  .notice.success { border-color: rgba(80, 200, 120, .35); background: rgba(80, 200, 120, .1); color: #bff0cf; }
  .notice-row { display: flex; align-items: center; gap: 10px; }
  .notice-row span { min-width: 0; flex: 1; overflow-wrap: anywhere; }
  .empty-state {
    width: min(100%, 620px);
    margin: 14vh auto 0;
    padding: 42px 24px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    color: var(--muted);
    text-align: center;
  }
  .empty-state h2 { margin: 0 0 8px; color: var(--text); }
  .validation { min-height: 20px; margin-top: 8px; color: var(--danger); font-size: 12px; }
  .toast {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 20;
    max-width: min(420px, calc(100vw - 36px));
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-3);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: .18s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .editor-modal {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    padding: 24px;
    background: rgba(7, 9, 13, .82);
    backdrop-filter: blur(4px);
  }
  .editor-modal.show { display: flex; }
  .editor-dialog {
    width: min(1180px, 100%);
    height: min(900px, 100%);
    margin: auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 22px 70px rgba(0, 0, 0, .48);
  }
  .editor-dialog-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .editor-dialog-title { min-width: 0; flex: 1; font-weight: 700; overflow-wrap: anywhere; }
  .expanded-editor {
    min-height: 0;
    flex: 1;
    resize: none;
    border: 0;
    border-radius: 0;
    padding: 18px;
    font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body.editor-open { overflow: hidden; }
  @media (max-width: 780px) {
    .header-hint { display: none; }
    header { padding-inline: 10px; }
    header .ghost { display: none; }
    .layout {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(180px, 35vh) minmax(0, 1fr);
    }
    aside { border-right: 0; border-bottom: 1px solid var(--border); }
    main { padding: 10px; }
    .card-head { display: block; padding: 14px; }
    .actions { justify-content: flex-start; margin-top: 12px; }
    .card-body { padding: 14px; }
    .variable-readonly, .variable-edit { grid-template-columns: 1fr; gap: 5px; }
    .variable-name { padding-top: 0; }
    .variable-edit .row-actions { justify-content: flex-end; }
    .body-editor { min-height: 42vh; }
    .large-variable .copy-variable-value { min-height: 180px; }
    .editor-modal { padding: 0; }
    .editor-dialog { width: 100%; height: 100%; border: 0; border-radius: 0; }
  }

  .mode-switch {
    display: inline-flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(0, 0, 0, .18);
  }
  .mode-switch a {
    padding: 4px 10px;
    border-radius: 5px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 650;
    text-decoration: none;
    white-space: nowrap;
  }
  .mode-switch a:hover { color: var(--text); }
  .mode-switch a.active { background: var(--panel-3); color: var(--text); }
</style>

    <main id="detail" class="max-[780px]:flex-1 max-[780px]:!p-4 max-[780px]:[&_.card]:!border-0 max-[780px]:[&_.card]:!bg-transparent max-[780px]:[&_.card]:!shadow-none max-[780px]:[&_.card-head]:!px-0 max-[780px]:[&_.card-head]:!pt-0 max-[780px]:[&_.card-body]:!px-0 max-[780px]:[&_.card-body]:!pt-4"></main>

      <div class="grid grid-cols-[1fr_1.4fr] gap-2"><button id="mobile-copy">复制全文</button><button id="mobile-dump" class="primary">落盘并复制路径</button></div>

      <textarea id="expanded-editor" class="expanded-editor" aria-label="编辑内容" spellcheck="false"></textarea>

        <div id="editor-feedback" class="max-h-28 overflow-auto text-xs break-all" role="status"></div>
        <div class="grid grid-cols-3 gap-2"><button id="editor-dump-selection" disabled>提取选区</button><button id="editor-dump-all">提取全文</button><button id="editor-undo" disabled>撤销替换</button></div>

  <div id="result-modal" class="!hidden fixed inset-0 z-[70] flex items-end justify-center bg-black/70 p-4 max-[780px]:!p-0 max-[780px]:!top-[var(--app-top,0px)] max-[780px]:!h-[var(--app-height,100dvh)] max-[780px]:!bottom-auto" aria-hidden="true">
    <div role="dialog" aria-modal="true" aria-labelledby="result-title" class="flex max-h-[90%] w-full max-w-2xl flex-col rounded-t-2xl border border-solid border-[var(--border)] bg-[var(--panel)] p-4 pb-[max(16px,env(safe-area-inset-bottom))]">
      <div class="mb-3 flex shrink-0 items-center gap-3"><h2 id="result-title" class="m-0 flex-1 text-lg"></h2><button id="close-result">关闭</button></div>
      <div id="result-content" class="min-h-0 overflow-y-auto"></div>

<script>
const WORKSPACE_API = '/api/goal-workspace';
const GOAL_DUMP_API = '/api/goal-dump';
const VARIABLE_START = '【变量区】';
const EXECUTION_START = '【执行区】';

let workspace = { version: 1, templates: [], workingCopies: [], activeItem: null };
let templateDraft = null;
let editingTemplateId = null;
let saveTimer = null;
let saveChain = Promise.resolve();
let savedSelection = { copyId: null, targetKey: null, target: null, textarea: null, start: 0, end: 0 };
let undoReplacement = null;
let expandedEditorState = null;
let lastDumpPath = '';
let lastDumpMessage = '';
let lastDumpError = false;
let expandedTemplateFamily = null;
let activeTab = 'parameters';
let operationCopyId = null;
let resultReturnFocus = null;
let editorReturnFocus = null;
let workspaceLoaded = false;
let moreParameters = false;

const byId = (id) => document.getElementById(id);
const statusEl = byId('status');

function isRecord(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

function normalizeWorkspace(value) {
  if (!isRecord(value)) throw new Error('工作台数据格式无效');
  const templates = Array.isArray(value.templates) ? value.templates : [];
  const workingCopies = Array.isArray(value.workingCopies) ? value.workingCopies : [];
  const activeItem = isRecord(value.activeItem) ? value.activeItem : null;
  return { version: 1, templates, workingCopies, activeItem };
}

function setStatus(text, className) {
  statusEl.textContent = text;
  statusEl.className = 'status max-[780px]:!min-w-0 shrink-0 cursor-pointer' + (className ? ' ' + className : '');
}

function toast(message) {
  const element = byId('toast');
  element.textContent = message;
  element.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => element.classList.remove('show'), 1800);
}

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function makeId(prefix) {
  if (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function') {
    return prefix + '-' + globalThis.crypto.randomUUID();
  }
  return prefix + '-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function nowIso() {
  return new Date().toISOString();
}

function localDateTime() {
  return new Intl.DateTimeFormat('zh-CN', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false,
  }).format(new Date());
}

function formatUpdated(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return new Intl.DateTimeFormat('zh-CN', {
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
  }).format(date);
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function isLargeVariableValue(value) {
  const text = String(value ?? '');
  return text.length > 400 || text.split('\n').length > 8;
}

function currentTemplate() {
  if (workspace.activeItem?.kind !== 'template') return null;
  return workspace.templates.find((item) => item.id === workspace.activeItem.id) ?? null;
}

function currentCopy() {
  if (workspace.activeItem?.kind !== 'copy') return null;
  return workspace.workingCopies.find((item) => item.id === workspace.activeItem.id) ?? null;
}

function snapshotWorkspace() {
  return JSON.stringify(workspace);
}

function enqueueSave(snapshot) {
  saveChain = saveChain.catch(() => undefined).then(async () => {
    setStatus('保存中...');
    const response = await fetch(WORKSPACE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: snapshot,
      signal: AbortSignal.timeout(3000),
    });
    if (!response.ok) {
      const payload = await response.json().catch(() => ({}));
      throw new Error(payload.message || '保存失败（' + response.status + '）');
    }
    if (snapshot === snapshotWorkspace() && !saveTimer) setStatus('已保存', 'ok');
    else setStatus('待保存');
  }).catch((error) => {
    console.error('[PromptBoard] Failed to save workspace:', error);
    setStatus('保存失败', 'err');
    throw error;
  });
  return saveChain;
}

function scheduleSave() {
  clearTimeout(saveTimer);
  setStatus('待保存');
  saveTimer = setTimeout(() => {
    saveTimer = null;
    enqueueSave(snapshotWorkspace()).catch(() => undefined);
  }, 450);
}

function persistNow() {
  clearTimeout(saveTimer);
  saveTimer = null;
  return enqueueSave(snapshotWorkspace());
}

async function loadWorkspace() {
  if (operationCopyId) return toast('正在落盘，请稍候');
  clearTimeout(saveTimer);
  closeExpandedEditor();
  setStatus('加载中...');
  try {
    const response = await fetch(WORKSPACE_API, { signal: AbortSignal.timeout(3000) });
    if (!response.ok) {
      const payload = await response.json().catch(() => ({}));
      throw new Error(payload.message || '加载失败（' + response.status + '）');
    }
    workspace = normalizeWorkspace(await response.json());
    workspaceLoaded = true;
    templateDraft = null;
    editingTemplateId = null;
    undoReplacement = null;
    lastDumpPath = '';
    lastDumpMessage = '';
    lastDumpError = false;
    if (!resolveActiveItem()) {
      workspace.activeItem = workspace.templates[0]
        ? { kind: 'template', id: workspace.templates[0].id }
        : (sortedCopies()[0] ? { kind: 'copy', id: sortedCopies()[0].id } : null);
    }
    render();
    setStatus('已加载', 'ok');
  } catch (error) {
    console.error('[PromptBoard] Failed to load workspace:', error);
    setStatus('加载失败', 'err');
    byId('detail').innerHTML = '<div class="empty-state"><h2>无法加载 Goal 工作台</h2><p>' +
      escapeHtml(error instanceof Error ? error.message : String(error)) +
      '</p><button id="retry-load">重试</button></div>';
    byId('retry-load')?.addEventListener('click', loadWorkspace);
  }
}

function resolveActiveItem() {
  if (workspace.activeItem?.kind === 'template') {
    return workspace.templates.some((item) => item.id === workspace.activeItem.id);
  }
  if (workspace.activeItem?.kind === 'copy') {
    return workspace.workingCopies.some((item) => item.id === workspace.activeItem.id);
  }
  return false;
}

function sortedCopies() {
  return [...workspace.workingCopies].sort((a, b) => {
    return String(b.updatedAt).localeCompare(String(a.updatedAt));
  });
}

const GOAL_SCENARIOS = ['BOE 飞书', 'BOE Nexus', '非 IM', 'PPE 飞书', 'PPE Nexus', 'PPE 非IM', 'PPE'];

function templateFamily(template) {
  const title = String(template.title || '未命名母版');
  for (const scenario of GOAL_SCENARIOS) {
    const suffix = '｜' + scenario;
    if (title.endsWith(suffix)) {
      return { name: title.slice(0, -suffix.length), scenario };
    }
  }
  return { name: title, scenario: '完整 Goal' };
}

function groupedTemplates() {
  const groups = new Map();
  workspace.templates.forEach((template) => {
    const family = templateFamily(template);
    if (!groups.has(family.name)) groups.set(family.name, []);
    groups.get(family.name).push({ template, scenario: family.scenario });
  });
  return Array.from(groups, ([name, items]) => ({ name, items }));
}

function selectItem(kind, id) {
  if (operationCopyId) return toast('正在落盘，请稍候');
  closePicker();
  activeTab = 'parameters';
  moreParameters = false;
  if (templateDraft && !confirm('当前母版编辑尚未保存，确定放弃更改吗？')) return;
  closeExpandedEditor();
  templateDraft = null;
  editingTemplateId = null;
  workspace.activeItem = { kind, id };
  if (kind === 'template') {
    const template = workspace.templates.find((item) => item.id === id);
    if (template) expandedTemplateFamily = templateFamily(template).name;
  }
  clearSavedSelection();
  undoReplacement = null;
  lastDumpPath = '';
  lastDumpMessage = '';
  lastDumpError = false;
  render();
  scheduleSave();
}

function render() {
  renderSidebar();
  renderDetail();
  updateMobileActions();
}

function renderSidebar() {
  const active = workspace.activeItem;
  const families = groupedTemplates();
  const activeTemplate = active?.kind === 'template'
    ? workspace.templates.find((template) => template.id === active.id)
    : null;
  const activeFamily = activeTemplate ? templateFamily(activeTemplate).name : null;
  if (!expandedTemplateFamily && activeFamily) expandedTemplateFamily = activeFamily;
  if (!expandedTemplateFamily && families[0]) expandedTemplateFamily = families[0].name;
  const templateRows = families.map((family) => {
    const open = expandedTemplateFamily === family.name;
    const familyClass = (open ? ' open' : '') + (activeFamily === family.name ? ' active-family' : '');
    const scenarios = open ? '<div class="scenario-list">' + family.items.map(({ template, scenario }) => {
      const activeClass = active?.kind === 'template' && active.id === template.id ? ' active' : '';
      return '<button class="item scenario-item' + activeClass + '" data-kind="template" data-id="' +
        escapeHtml(template.id) + '"><span class="item-title">' + escapeHtml(scenario) +
        '</span><span class="item-meta">' + template.variables.length + ' 个变量 · ' +
        escapeHtml(formatUpdated(template.updatedAt)) + '</span></button>';
    }).join('') + '</div>' : '';
    return '<button class="family-item' + familyClass + '" data-template-family="' + escapeHtml(family.name) + '">' +
      '<span class="family-caret">' + (open ? '▼' : '▶') + '</span><span class="item-title">' +
      escapeHtml(family.name) + '</span><span class="family-count">' + family.items.length + '</span></button>' + scenarios;
  }).join('');
  const copyRows = sortedCopies().map((copy) => {
    const activeClass = active?.kind === 'copy' && active.id === copy.id ? ' active' : '';
    return '<button class="item' + activeClass + '" data-kind="copy" data-id="' +
      escapeHtml(copy.id) + '"><span class="item-title">' + escapeHtml(copy.title || '未命名副本') +
      '</span><span class="item-meta">' + escapeHtml(copy.sourceTemplateTitle || '独立副本') + ' · ' +
      escapeHtml(formatUpdated(copy.updatedAt)) + '</span></button>';
  }).join('');
  byId('sidebar').innerHTML =
    '<section class="side-section"><div class="side-head"><span class="side-title">Goal 母版</span>' +
    '<span class="count">' + families.length + ' 组 · ' + workspace.templates.length + '</span></div>' +
    (templateRows || '<div class="side-empty">Prompt 库中暂无名称或 ID 包含 Goal 的分组</div>') + '</section>' +
    '<section class="side-section"><div class="side-head"><span class="side-title">工作副本</span>' +
    '<span class="count">' + workspace.workingCopies.length + '</span></div>' +
    (copyRows || '<div class="side-empty">从母版创建独立工作副本</div>') + '</section><a href="/prompt-board.html" class="min-[781px]:!hidden block p-4 text-[var(--accent)]">前往 Prompt 库 →</a>';
  byId('sidebar').querySelectorAll('[data-template-family]').forEach((element) => {
    element.addEventListener('click', () => {
      expandedTemplateFamily = element.dataset.templateFamily;
      renderSidebar();
    });
  });
  byId('sidebar').querySelectorAll('[data-kind]').forEach((element) => {
    element.addEventListener('click', () => selectItem(element.dataset.kind, element.dataset.id));
  });
}

function renderDetail() {
  if (templateDraft) {
    renderTemplateEditor();
    return;
  }
  const template = currentTemplate();
  if (template) {
    renderTemplateView(template);
    return;
  }
  const copy = currentCopy();
  if (copy) {
    renderCopyView(copy);
    return;
  }
  byId('detail').innerHTML =
    '<div class="empty-state"><h2>暂无 Goal 分组</h2>' +
    '<p>请先在 Prompt 库创建名称或 ID 包含 Goal 的分组；其中的块会按顺序自动合成一份完整母版。</p>' +
    '<a href="/prompt-board.html"><button class="primary">前往 Prompt 库</button></a></div>';
}

function startNewTemplate() {
  if (templateDraft && !confirm('当前母版编辑尚未保存，确定放弃更改吗？')) return;
  const timestamp = nowIso();
  editingTemplateId = null;
  templateDraft = {
    id: makeId('template'),
    title: '新 Goal 母版',
    variables: [],
    body: '',
    createdAt: timestamp,
    updatedAt: timestamp,
  };
  render();
  requestAnimationFrame(() => byId('template-title')?.select());
}

function startEditTemplate(template) {
  editingTemplateId = template.id;
  templateDraft = clone(template);
  renderDetail();
}

function cancelTemplateEdit() {
  templateDraft = null;
  editingTemplateId = null;
  render();
}

function validateTemplateDraft() {
  if (!templateDraft.title.trim()) return '母版名称不能为空';
  const seen = new Set();
  for (const variable of templateDraft.variables) {
    const name = variable.name.trim();
    if (!name) return '变量名不能为空';
    if (/[\r\n=]/.test(name)) return '变量名不能包含换行或 =';
    const normalized = name.toLocaleLowerCase();
    if (seen.has(normalized)) return '变量名不能重复（忽略大小写）：' + name;
    seen.add(normalized);
  }
  return '';
}

function saveTemplateDraft() {
  const error = validateTemplateDraft();
  const validation = byId('template-validation');
  if (validation) validation.textContent = error;
  if (error) return;
  templateDraft.title = templateDraft.title.trim();
  templateDraft.variables.forEach((variable) => {
    variable.name = variable.name.trim();
  });
  templateDraft.updatedAt = nowIso();
  if (editingTemplateId) {
    const index = workspace.templates.findIndex((item) => item.id === editingTemplateId);
    if (index >= 0) workspace.templates[index] = clone(templateDraft);
  } else {
    workspace.templates.push(clone(templateDraft));
  }
  workspace.activeItem = { kind: 'template', id: templateDraft.id };
  templateDraft = null;
  editingTemplateId = null;
  render();
  persistNow().catch(() => toast('母版保存失败，可继续编辑后重试'));
}

function renderTemplateEditor() {
  const variableRows = templateDraft.variables.map((variable, index) => {
    return '<div class="variable-edit" data-variable-index="' + index + '">' +
      '<input class="draft-variable-name" value="' + escapeHtml(variable.name) + '" aria-label="变量名" placeholder="VARIABLE_NAME" />' +
      '<textarea class="draft-variable-value" aria-label="变量默认值" placeholder="默认值，可多行">' +
      escapeHtml(variable.defaultValue) + '</textarea>' +
      '<div class="row-actions"><button data-move="-1" title="上移">↑</button><button data-move="1" title="下移">↓</button>' +
      '<button data-remove title="删除变量" class="danger">×</button></div></div>';
  }).join('');
  byId('detail').innerHTML =
    '<article class="card"><div class="card-head"><div class="card-heading"><div class="eyebrow">' +
    (editingTemplateId ? '编辑 Goal 母版' : '新建 Goal 母版') +
    '</div><h2>变量定义与完整正文</h2><div class="meta">更改只有在显式保存后才会写入母版</div></div>' +
    '<div class="actions"><button id="cancel-template">取消</button><button id="save-template" class="primary">保存母版</button></div></div>' +
    '<div class="card-body"><section class="section"><label class="field-label" for="template-title">母版名称</label>' +
    '<input id="template-title" class="title-field" value="' + escapeHtml(templateDraft.title) + '" /></section>' +
    '<section class="section"><span class="section-label">顶部变量区（有序）</span><div id="draft-variables" class="variable-list">' +
    (variableRows || '<div class="notice">尚未定义变量。变量会始终出现在最终 Goal 的最前面。</div>') +
    '</div><div style="margin-top:10px"><button id="add-variable">+ 添加变量</button></div></section>' +
    '<section class="section"><label class="section-label" for="template-body">完整 Goal 正文</label>' +
    '<textarea id="template-body" class="body-editor" placeholder="在这里编写完整 Goal 正文...">' +
    escapeHtml(templateDraft.body) + '</textarea></section>' +
    '<div id="template-validation" class="validation"></div></div></article>';

  byId('template-title').addEventListener('input', (event) => { templateDraft.title = event.target.value; });
  byId('template-body').addEventListener('input', (event) => { templateDraft.body = event.target.value; });
  byId('cancel-template').addEventListener('click', cancelTemplateEdit);
  byId('save-template').addEventListener('click', saveTemplateDraft);
  byId('add-variable').addEventListener('click', () => {
    templateDraft.variables.push({ name: '', defaultValue: '' });
    renderTemplateEditor();
    const names = byId('draft-variables').querySelectorAll('.draft-variable-name');
    names[names.length - 1]?.focus();
  });
  byId('draft-variables').querySelectorAll('[data-variable-index]').forEach((row) => {
    const index = Number(row.dataset.variableIndex);
    row.querySelector('.draft-variable-name').addEventListener('input', (event) => {
      templateDraft.variables[index].name = event.target.value;
    });
    row.querySelector('.draft-variable-value').addEventListener('input', (event) => {
      templateDraft.variables[index].defaultValue = event.target.value;
    });
    row.querySelector('[data-remove]').addEventListener('click', () => {
      templateDraft.variables.splice(index, 1);
      renderTemplateEditor();
    });
    row.querySelectorAll('[data-move]').forEach((button) => {
      button.addEventListener('click', () => {
        const target = index + Number(button.dataset.move);
        if (target < 0 || target >= templateDraft.variables.length) return;
        const moved = templateDraft.variables.splice(index, 1)[0];
        templateDraft.variables.splice(target, 0, moved);
        renderTemplateEditor();
      });
    });
  });
}

function renderTemplateView(template) {
  const variables = template.variables.map((variable) => {
    const largeClass = isLargeVariableValue(variable.defaultValue) ? ' large-variable' : '';
    return '<div class="variable-readonly' + largeClass + '"><div class="variable-name">' + escapeHtml(variable.name) +
      '</div><pre class="variable-value">' + escapeHtml(variable.defaultValue) + '</pre></div>';
  }).join('');
  byId('detail').innerHTML =
    '<article class="card"><div class="card-head"><div class="card-heading"><div class="eyebrow">Goal 分组自动合并 · 只读</div>' +
    '<h2>' + escapeHtml(template.title || '未命名母版') + '</h2><div class="meta">更新于 ' +
    escapeHtml(formatUpdated(template.updatedAt)) + ' · 已按 Prompt 库中的块顺序拼成完整内容</div></div>' +
    '<div class="actions"><button id="create-copy" class="primary">新建工作副本</button>' +
    '<button id="copy-template">复制完整 Goal</button></div></div>' +
    '<div class="card-body"><section class="section"><span class="section-label">变量默认值</span>' +
    '<div class="variable-list">' + (variables || '<div class="notice">此母版没有变量。</div>') + '</div></section>' +
    '<section class="section"><span class="section-label">完整 Goal 正文</span><pre class="readonly-body">' +
    escapeHtml(template.body) + '</pre></section></div></article>';
  byId('create-copy').addEventListener('click', () => createWorkingCopy(template));
  byId('copy-template').addEventListener('click', () => copyCompleteGoal(
    template.variables.map((variable) => ({ name: variable.name, value: variable.defaultValue })),
    template.body
  ));
}

function createWorkingCopy(template) {
  const timestamp = nowIso();
  const copy = {
    id: makeId('copy'),
    sourceTemplateId: template.id,
    sourceTemplateTitle: template.title,
    title: template.title + ' · ' + localDateTime(),
    variables: template.variables.map((variable) => ({
      name: variable.name,
      value: variable.defaultValue,
    })),
    body: template.body,
    createdAt: timestamp,
    updatedAt: timestamp,
  };
  activeTab = 'parameters';
  moreParameters = false;
  workspace.workingCopies.push(copy);
  workspace.activeItem = { kind: 'copy', id: copy.id };
  undoReplacement = null;
  lastDumpPath = '';
  lastDumpMessage = '';
  lastDumpError = false;
  render();
  persistNow().catch(() => toast('工作副本保存失败，可继续编辑后重试'));
}

function deleteTemplate(template) {
  if (!confirm('删除母版“' + template.title + '”？已有工作副本和附件会保留。')) return;
  workspace.templates = workspace.templates.filter((item) => item.id !== template.id);
  workspace.activeItem = sortedCopies()[0]
    ? { kind: 'copy', id: sortedCopies()[0].id }
    : (workspace.templates[0] ? { kind: 'template', id: workspace.templates[0].id } : null);
  render();
  persistNow().catch(() => toast('删除保存失败'));
}

function deleteCopy(copy) {
  if (operationCopyId) return toast('正在落盘，请稍候');
  if (!confirm('删除工作副本“' + copy.title + '”？已经落盘的附件会继续保留。')) return;
  workspace.workingCopies = workspace.workingCopies.filter((item) => item.id !== copy.id);
  workspace.activeItem = sortedCopies()[0]
    ? { kind: 'copy', id: sortedCopies()[0].id }
    : (workspace.templates[0] ? { kind: 'template', id: workspace.templates[0].id } : null);
  undoReplacement = null;
  render();
  persistNow().catch(() => toast('删除保存失败'));
}

function touchCopy(copy) {
  copy.updatedAt = nowIso();
  renderFiles(copy);
  scheduleSave();
}

function editTargetKey(target) {
  return target.kind === 'body' ? 'body' : 'variable:' + target.index;
}

function editTargetValue(copy, target) {
  return target.kind === 'body' ? copy.body : copy.variables[target.index]?.value ?? '';
}

function setEditTargetValue(copy, target, value) {
  if (editTargetValue(copy, target) !== value) copy.contentRevision = (copy.contentRevision ?? 0) + 1;
  if (target.kind === 'body') copy.body = value;
  else if (copy.variables[target.index]) copy.variables[target.index].value = value;
}

function targetTextarea(target) {
  if (expandedEditorState?.targetKey === editTargetKey(target)) return byId('expanded-editor');
  if (target.kind === 'body') return byId('copy-body');
  return byId('detail').querySelector('[data-copy-variable-index="' + target.index + '"] textarea');
}

function clearSavedSelection() {
  savedSelection = { copyId: null, targetKey: null, target: null, textarea: null, start: 0, end: 0 };
}

function rememberSelection(textarea, copy, target) {
  if (!textarea || document.activeElement !== textarea && textarea.selectionStart === null) return;
  savedSelection = {
    copyId: copy.id,
    targetKey: editTargetKey(target),
    target,
    textarea,
    start: textarea.selectionStart ?? 0,
    end: textarea.selectionEnd ?? 0,
  };
  updateDumpButton(copy);
}

function hasSelection(copy, target) {
  return savedSelection.copyId === copy.id &&
    (!target || savedSelection.targetKey === editTargetKey(target)) &&
    savedSelection.end > savedSelection.start;
}

function updateDumpButton(copy) {
  const button = byId('dump-selection');
  if (button) button.disabled = !hasSelection(copy) || Boolean(operationCopyId);
  const editorSelected = expandedEditorState?.copyId === copy.id && hasSelection(copy, expandedEditorState.target);
  byId('editor-dump-selection').disabled = !editorSelected || Boolean(operationCopyId);
  byId('editor-dump-all').disabled = Boolean(operationCopyId) || !byId('expanded-editor').value;
  byId('editor-undo').disabled = Boolean(operationCopyId) || undoReplacement?.copyId !== copy.id;
  byId('editor-count').textContent = byId('expanded-editor').value.length.toLocaleString() + ' 字' +
    (editorSelected ? ' · 已选 ' + (savedSelection.end - savedSelection.start).toLocaleString() + ' 字' : ' · 长按文字选择选区');
}

function renderDumpFeedback(copy) {
  const container = byId('dump-feedback');
  if (!container || currentCopy()?.id !== copy.id) return;
  byId('editor-feedback').textContent = expandedEditorState?.copyId === copy.id ? lastDumpMessage : '';
  updateDumpButton(copy);
  if (!lastDumpMessage && !lastDumpPath) {
    container.innerHTML = '';
    return;
  }
  const className = lastDumpError ? 'notice error' : 'notice success';
  const path = lastDumpPath ? '<div class="mt-1 break-all">' + escapeHtml(lastDumpPath) + '</div>' : '';
  const undo = undoReplacement?.copyId === copy.id
    ? '<button id="undo-replacement">撤销替换</button>'
    : '';
  container.innerHTML = '<div class="' + className + ' notice-row"><span>' +
    escapeHtml(lastDumpMessage) + path + '</span>' + undo + '</div>';
  byId('undo-replacement')?.addEventListener('click', () => undoDumpReplacement(copy));
}

function renderCopyView(copy) {
  const variables = copy.variables.map((variable, index) => {
    const largeClass = isLargeVariableValue(variable.value) ? ' large-variable' : '';
    return '<div class="variable-readonly max-[780px]:rounded-xl max-[780px]:bg-[var(--panel)] max-[780px]:p-3' + largeClass + '" data-copy-variable-index="' + index + '">' +
      '<div class="variable-name">' + escapeHtml(variable.name) + '</div>' +
      '<div class="editable-field">' +
      '<textarea rows="1" class="copy-variable-value max-[780px]:!min-h-11 max-[780px]:!h-11 max-[780px]:!pr-3" aria-label="' + escapeHtml(variable.name) +
      ' 的值" placeholder="本次变量值，可多行">' + escapeHtml(variable.value) + '</textarea>' +
      '<button class="expand-editor max-[780px]:!static max-[780px]:mt-2 max-[780px]:!text-xs max-[780px]:!w-full" data-expand-variable="' + index + '">打开编辑</button></div></div>';
  }).join('');
  byId('detail').innerHTML =
    '<article class="card"><div class="card-head"><div class="card-heading"><div class="eyebrow">工作副本 · 自动保存</div>' +
    '<input id="copy-title" class="title-field" aria-label="工作副本名称" value="' + escapeHtml(copy.title) + '" />' +
    '<div class="meta">源母版：' + escapeHtml(copy.sourceTemplateTitle || '已删除的母版') +
    ' · 更新于 ' + escapeHtml(formatUpdated(copy.updatedAt)) + '</div></div>' +
    '<div class="actions max-[780px]:!hidden"><button id="dump-selection" disabled>落盘选中</button>' +
    '<button id="dump-goal">落盘完整 Goal 并复制路径</button>' +
    '<button id="copy-goal" class="primary">复制完整 Goal</button><button id="delete-copy" class="danger">删除</button></div></div>' +
    '<div class="min-[781px]:!hidden mt-3 flex items-center gap-2"><span class="flex-1 text-xs text-[var(--muted)]">本次配置</span><button id="preview-goal" class="!text-xs">预览全文</button><button id="mobile-delete" class="danger !text-xs">删除副本</button></div>' +
    '<div class="min-[781px]:!hidden mt-4 grid grid-cols-3 gap-1 rounded-xl bg-[var(--panel)] p-1" role="tablist" aria-label="工作副本内容">' +
    [['parameters', '参数'], ['body', '正文'], ['files', '附件']].map(([key, label]) => '<button role="tab" id="tab-' + key + '" aria-controls="panel-' + key + '" data-tab="' + key + '" class="!border-0 !bg-transparent aria-selected:!bg-[var(--panel-3)] aria-selected:!text-[var(--accent)]">' + label + '</button>').join('') + '</div>' +
    '<div class="card-body"><div id="dump-feedback" role="status"></div>' +
    '<section id="panel-parameters" data-panel="parameters" class="section"><span class="section-label">本次参数 <span class="max-[780px]:!hidden">· 选中文字可提取为附件</span></span>' +
    '<div class="variable-list">' + (variables || '<div class="notice">此副本没有变量。</div>') + '</div><button id="more-parameters" class="!hidden min-[781px]:!hidden mt-3 w-full !text-xs"></button></section>' +
    '<section id="panel-body" data-panel="body" class="section max-[780px]:!mt-0"><label class="section-label" for="copy-body">执行正文 · 可打开全屏编辑</label>' +
    '<div class="editable-field"><textarea id="copy-body" class="body-editor max-[780px]:!pr-3" placeholder="在这里编辑本次完整 Goal...">' +
    escapeHtml(copy.body) + '</textarea><button id="expand-copy-body" class="expand-editor max-[780px]:!static max-[780px]:mt-3 max-[780px]:!w-full">打开编辑</button></div>' +
    '</section><section id="panel-files" data-panel="files" class="section max-[780px]:!mt-0"><div id="file-list"></div></section></div></article>';

  const bodyEditor = byId('copy-body');
  const titleEditor = byId('copy-title');
  const dumpButton = byId('dump-selection');
  titleEditor.addEventListener('input', (event) => {
    copy.title = event.target.value;
    touchCopy(copy);
    const sideTitle = byId('sidebar').querySelector('[data-kind="copy"][data-id="' + CSS.escape(copy.id) + '"] .item-title');
    if (sideTitle) sideTitle.textContent = copy.title || '未命名副本';
  });
  byId('detail').querySelectorAll('[data-copy-variable-index]').forEach((row) => {
    const index = Number(row.dataset.copyVariableIndex);
    const textarea = row.querySelector('textarea');
    const target = { kind: 'variable', index };
    textarea.addEventListener('input', (event) => {
      setEditTargetValue(copy, target, event.target.value);
      invalidateUndoForTarget(copy, target);
      touchCopy(copy);
    });
    ['select', 'keyup', 'pointerup', 'touchend', 'blur'].forEach((eventName) => {
      textarea.addEventListener(eventName, () => rememberSelection(textarea, copy, target));
    });
    row.querySelector('[data-expand-variable]').addEventListener('click', () => {
      openExpandedEditor(copy, target, copy.variables[index].name);
    });
  });
  const bodyTarget = { kind: 'body' };
  bodyEditor.addEventListener('input', (event) => {
    setEditTargetValue(copy, bodyTarget, event.target.value);
    invalidateUndoForTarget(copy, bodyTarget);
    touchCopy(copy);
    rememberSelection(bodyEditor, copy, bodyTarget);
  });
  ['select', 'keyup', 'pointerup', 'touchend', 'blur'].forEach((eventName) => {
    bodyEditor.addEventListener(eventName, () => rememberSelection(bodyEditor, copy, bodyTarget));
  });
  dumpButton.addEventListener('click', () => {
    if (savedSelection.copyId !== copy.id || !savedSelection.textarea || !savedSelection.target) return;
    dumpSelection(copy, savedSelection.textarea, savedSelection.target);
  });
  byId('expand-copy-body').addEventListener('click', () => openExpandedEditor(copy, bodyTarget, '完整 Goal 正文'));
  byId('dump-goal').addEventListener('click', () => dumpCompleteGoal(copy));
  byId('copy-goal').addEventListener('click', () => copyCompleteGoal(copy.variables, copy.body));
  byId('delete-copy').addEventListener('click', () => deleteCopy(copy));
  byId('preview-goal').addEventListener('click', () => previewGoal(copy));
  byId('mobile-delete').addEventListener('click', () => deleteCopy(copy));
  byId('detail').querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => setTab(button.dataset.tab)));
  byId('more-parameters').addEventListener('click', () => { moreParameters = !moreParameters; updateMobileFields(); });
  renderFiles(copy);
  setTab(activeTab);
  updateMobileFields();
  renderDumpFeedback(copy);
  updateDumpButton(copy);
}

function invalidateUndoForTarget(copy, target) {
  if (!undoReplacement || undoReplacement.copyId !== copy.id ||
      undoReplacement.targetKey !== editTargetKey(target)) return;
  if (editTargetValue(copy, target) === undoReplacement.afterValue) return;
  undoReplacement = null;
  lastDumpMessage = lastDumpPath ? '附件已保留；内容继续编辑后不可再撤销替换。' : '';
  renderDumpFeedback(copy);
}

function openExpandedEditor(copy, target, label) {
  const sourceTextarea = targetTextarea(target);
  if (!sourceTextarea) return;
  const editor = byId('expanded-editor');
  const modal = byId('editor-modal');
  expandedEditorState = {
    copyId: copy.id,
    target,
    targetKey: editTargetKey(target),
    sourceTextarea,
    sourceScrollTop: sourceTextarea.scrollTop,
    sourceScrollLeft: sourceTextarea.scrollLeft,
  };
  editorReturnFocus = document.activeElement;
  byId('editor-dialog-title').textContent = label;
  editor.value = editTargetValue(copy, target);
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  document.body.classList.add('editor-open');
  const start = sourceTextarea.selectionStart ?? editor.value.length;
  const end = sourceTextarea.selectionEnd ?? start;
  editor.focus({ preventScroll: true });
  editor.setSelectionRange(start, end);
  editor.scrollTop = sourceTextarea.scrollTop;
  editor.scrollLeft = sourceTextarea.scrollLeft;
  rememberSelection(editor, copy, target);
  renderDumpFeedback(copy);
  syncModalInert();
  editor.oninput = (event) => {
    setEditTargetValue(copy, target, event.target.value);
    sourceTextarea.value = event.target.value;
    invalidateUndoForTarget(copy, target);
    touchCopy(copy);
    rememberSelection(editor, copy, target);
  };
  ['select', 'keyup', 'pointerup', 'touchend', 'blur'].forEach((eventName) => {
    editor['on' + eventName] = () => rememberSelection(editor, copy, target);
  });
}

function closeExpandedEditor() {
  if (!expandedEditorState) return;
  const state = expandedEditorState;
  const editor = byId('expanded-editor');
  const copy = currentCopy();
  if (copy?.id === state.copyId) {
    state.sourceTextarea.value = editTargetValue(copy, state.target);
    state.sourceTextarea.focus({ preventScroll: true });
    state.sourceTextarea.setSelectionRange(editor.selectionStart ?? 0, editor.selectionEnd ?? 0);
    state.sourceTextarea.scrollTop = state.sourceScrollTop;
    state.sourceTextarea.scrollLeft = state.sourceScrollLeft;
    rememberSelection(state.sourceTextarea, copy, state.target);
  }
  expandedEditorState = null;
  byId('editor-modal').classList.remove('show');
  byId('editor-modal').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('editor-open');
  syncModalInert();
  updateMobileFields();
  editorReturnFocus?.focus({ preventScroll: true });
}

function formatVariable(name, value) {
  const lines = String(value ?? '').split(/\r?\n/);
  const first = lines.shift() ?? '';
  return name + ' = ' + first + lines.map((line) => '\n  ' + line).join('');
}

function completeGoalText(variables, body) {
  const variableBlock = variables.map((variable) => {
    return formatVariable(variable.name, variable.value);
  }).join('\n');
  return VARIABLE_START + '\n' + variableBlock + '\n\n' + EXECUTION_START + '\n' + String(body ?? '');
}

async function writeClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (error) {
    const fallback = document.createElement('textarea');
    fallback.value = text;
    fallback.className = 'fixed opacity-0';
    document.body.appendChild(fallback);
    fallback.select();
    const copied = document.execCommand('copy');
    fallback.remove();
    if (!copied) throw error;
  }
}

function copyCompleteGoal(variables, body) {
  writeClipboard(completeGoalText(variables, body))
    .then(() => toast('完整 Goal 已复制'))
    .catch((error) => {
      console.error('[PromptBoard] Failed to copy goal:', error);
      showCopySheet('复制完整 Goal', completeGoalText(variables, body), '自动复制不可用，可全选后手动复制。');
    });
}

async function writeGoalFile(copy, text) {
  // The server validates copy ownership; flush newly created copies before writing.
  await persistNow();
  const response = await fetch(GOAL_DUMP_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ workingCopyId: copy.id, text }),
    signal: AbortSignal.timeout(3000),
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok || typeof payload.path !== 'string') {
    throw new Error(payload.message || '落盘失败（' + response.status + '）');
  }
  return payload.path;
}

function addFile(copy, path, kind, label, revision) {
  copy.files ??= [];
  copy.files.push({ id: makeId('file'), path, kind, label, createdAt: nowIso(), revision });
  renderFiles(copy);
}

function setOperation(copy, busy) {
  operationCopyId = busy ? copy.id : null;
  ['dump-goal', 'mobile-dump'].forEach(id => {
    const button = byId(id);
    if (!button) return;
    button.disabled = busy;
    button.textContent = busy ? '落盘中…' : (id === 'mobile-dump' ? '落盘并复制路径' : '落盘完整 Goal 并复制路径');
  });
  updateDumpButton(copy);
  renderFiles(copy);
}

async function saveFileMetadata() {
  try {
    await persistNow();
    return true;
  } catch {
    lastDumpMessage += ' 文件已生成，但附件记录保存失败，请点击顶部保存状态重试。';
    return false;
  }
}

async function dumpCompleteGoal(copy) {
  if (operationCopyId) return;
  const text = completeGoalText(copy.variables, copy.body);
  const revision = copy.contentRevision ?? 0;
  setOperation(copy, true);
  lastDumpPath = '';
  lastDumpMessage = '';
  lastDumpError = false;
  renderDumpFeedback(copy);
  try {
    const path = await writeGoalFile(copy, text);
    lastDumpPath = path;
    addFile(copy, path, 'goal', '完整 Goal', revision);
    lastDumpMessage = '完整 Goal 已落盘。';
    const saved = await saveFileMetadata();
    try {
      await writeClipboard(path);
      if (saved) lastDumpMessage = '完整 Goal 已落盘，路径已复制。';
    } catch (error) {
      console.error('[GoalBoard] Failed to copy path:', error);
      if (saved) lastDumpMessage = '完整 Goal 已落盘，但自动复制路径失败，请手动复制。';
    }
    renderDumpFeedback(copy);
    if (isMobile()) showCopySheet('完整 Goal 已落盘', path, lastDumpMessage);
    else toast(lastDumpMessage);
  } catch (error) {
    console.error('[GoalBoard] Failed to dump complete goal:', error);
    lastDumpError = true;
    lastDumpMessage = (error instanceof Error ? error.message : String(error)) + '，完整 Goal 未落盘，可重试。';
    renderDumpFeedback(copy);
  } finally {
    setOperation(copy, false);
  }
}

async function dumpSelection(copy, textarea, target, entireField = false) {
  if (operationCopyId) return;
  if (entireField) textarea.setSelectionRange(0, textarea.value.length);
  rememberSelection(textarea, copy, target);
  if (!hasSelection(copy, target)) return;
  const { start, end } = savedSelection;
  const beforeValue = editTargetValue(copy, target);
  const selectedText = beforeValue.slice(start, end);
  if (!selectedText) return;
  const scrollTop = textarea.scrollTop;
  setOperation(copy, true);
  lastDumpError = false;
  lastDumpMessage = '';
  renderDumpFeedback(copy);
  try {
    const path = await writeGoalFile(copy, selectedText);
    lastDumpPath = path;
    addFile(copy, path, 'attachment', target.kind === 'body' ? '正文摘录' : copy.variables[target.index].name, copy.contentRevision ?? 0);
    // A request may finish after the user has continued typing. Never overwrite that edit.
    if (editTargetValue(copy, target) === beforeValue) {
      const afterValue = beforeValue.slice(0, start) + path + beforeValue.slice(end);
      setEditTargetValue(copy, target, afterValue);
      undoReplacement = { copyId: copy.id, target, targetKey: editTargetKey(target), beforeValue, afterValue };
      textarea.value = afterValue;
      const source = target.kind === 'body' ? byId('copy-body') : byId('detail').querySelector('[data-copy-variable-index="' + target.index + '"] textarea');
      if (source) source.value = afterValue;
      if (expandedEditorState?.targetKey === editTargetKey(target)) byId('expanded-editor').value = afterValue;
      const cursor = start + path.length;
      textarea.setSelectionRange(cursor, cursor);
      textarea.scrollTop = scrollTop;
      clearSavedSelection();
      lastDumpMessage = '选区已落盘并在原位置替换。';
      touchCopy(copy);
    } else {
      lastDumpMessage = '附件已落盘；检测到继续编辑，保留最新内容，未替换选区。';
    }
    await saveFileMetadata();
    updateMobileFields();
    renderDumpFeedback(copy);
  } catch (error) {
    console.error('[GoalBoard] Failed to dump selection:', error);
    lastDumpError = true;
    lastDumpMessage = (error instanceof Error ? error.message : String(error)) + '，内容未改变，可重试。';
    renderDumpFeedback(copy);
  } finally {
    setOperation(copy, false);
  }
}

function undoDumpReplacement(copy) {
  if (operationCopyId) return;
  if (!undoReplacement || undoReplacement.copyId !== copy.id) return;
  const target = undoReplacement.target;
  setEditTargetValue(copy, target, undoReplacement.beforeValue);
  copy.updatedAt = nowIso();
  const textarea = targetTextarea(target);
  if (textarea) {
    textarea.value = undoReplacement.beforeValue;
    textarea.focus();
  }
  if (expandedEditorState?.targetKey === editTargetKey(target)) {
    expandedEditorState.sourceTextarea.value = undoReplacement.beforeValue;
  }
  undoReplacement = null;
  clearSavedSelection();
  lastDumpError = false;
  lastDumpMessage = '引用替换已撤销；已经生成的附件继续保留。';
  renderDumpFeedback(copy);
  renderFiles(copy);
  updateMobileFields();
  updateDumpButton(copy);
  persistNow().catch(() => {
    lastDumpError = true;
    lastDumpMessage = '内容已恢复，但保存失败；请继续编辑以重试自动保存。';
    renderDumpFeedback(copy);
  });
}

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    if (byId('result-modal').getAttribute('aria-hidden') === 'false') closeResult();
    else if (expandedEditorState) closeExpandedEditor();
    else closePicker();
  }
  trapModalFocus(event);
  if (!event.altKey || !(event.ctrlKey || event.metaKey) || event.key.toLowerCase() !== 's') return;
  const copy = currentCopy();
  const textarea = savedSelection.textarea;
  const target = savedSelection.target;
  if (!copy || !textarea || !target || !textarea.isConnected) return;
  rememberSelection(textarea, copy, target);
  if (!hasSelection(copy, target)) return;
  event.preventDefault();
  dumpSelection(copy, textarea, target);
});

byId('close-expanded-editor').addEventListener('click', closeExpandedEditor);
byId('editor-modal').addEventListener('pointerdown', (event) => {
  if (event.target === byId('editor-modal')) closeExpandedEditor();
});

byId('reload').addEventListener('click', () => {
  if (templateDraft && !confirm('当前母版编辑尚未保存，确定重新加载吗？')) return;
  if (!workspaceLoaded) { loadWorkspace(); return; }
  persistNow().then(loadWorkspace).catch(() => toast('保存失败，请重试后再刷新'));
});

function isMobile() {
  return window.matchMedia?.('(max-width: 780px)').matches ?? false;
}

function setTab(tab) {
  activeTab = tab;
  byId('detail').querySelectorAll('[data-panel]').forEach(panel => {
    panel.classList.toggle('max-[780px]:!hidden', panel.dataset.panel !== tab);
  });
  byId('detail').querySelectorAll('[data-tab]').forEach(button => {
    button.setAttribute('aria-selected', String(button.dataset.tab === tab));
  });
}

function updateMobileActions() {
  const visible = currentCopy() && !templateDraft;
  byId('mobile-actions').classList.toggle('!hidden', !visible);
  byId('mobile-actions').classList.add('min-[781px]:!hidden');
}

function updateMobileFields() {
  let shortCount = 0;
  let extraCount = 0;
  byId('detail').querySelectorAll('[data-copy-variable-index]').forEach(row => {
    const textarea = row.querySelector('textarea');
    const button = row.querySelector('[data-expand-variable]');
    const isLong = textarea.value.length > 100 || textarea.value.includes('\n') || /HINT|REFERENCE|CONTEXT|DESCRIPTION/i.test(textarea.getAttribute('aria-label'));
    if (!isLong) shortCount++;
    const extra = !isLong && shortCount > 4;
    if (extra) extraCount++;
    row.classList.toggle('max-[780px]:!hidden', extra && !moreParameters);
    textarea.classList.toggle('max-[780px]:!h-24', isLong);
    textarea.classList.toggle('max-[780px]:!h-11', !isLong);
    textarea.readOnly = isMobile() && isLong;
    button.classList.toggle('max-[780px]:!hidden', !isLong);
    if (isMobile()) button.textContent = '编辑长文本 · ' + textarea.value.length.toLocaleString() + ' 字';
    else button.textContent = '打开编辑';
  });
  const moreButton = byId('more-parameters');
  if (moreButton) {
    moreButton.classList.toggle('!hidden', !extraCount);
    moreButton.textContent = moreParameters ? '收起更多参数' : '显示其余 ' + extraCount + ' 个参数';
  }
}

function openPicker() {
  byId('sidebar').classList.remove('max-[780px]:!hidden');
  byId('picker-backdrop').classList.remove('!hidden');
  byId('open-picker').setAttribute('aria-expanded', 'true');
  byId('detail').inert = true;
  byId('mobile-actions').inert = true;
  byId('sidebar').querySelector('.active, button')?.focus();
}

function closePicker() {
  const wasOpen = byId('open-picker').getAttribute('aria-expanded') === 'true';
  byId('sidebar').classList.add('max-[780px]:!hidden');
  byId('picker-backdrop').classList.add('!hidden');
  byId('open-picker').setAttribute('aria-expanded', 'false');
  byId('detail').inert = false;
  byId('mobile-actions').inert = false;
  if (wasOpen) byId('open-picker').focus();
}

function syncModalInert() {
  const resultOpen = byId('result-modal').getAttribute('aria-hidden') === 'false';
  document.querySelector('.layout').inert = Boolean(expandedEditorState) || resultOpen;
  document.querySelector('header').inert = Boolean(expandedEditorState) || resultOpen;
  byId('editor-modal').inert = resultOpen;
}

function trapModalFocus(event) {
  if (event.key !== 'Tab') return;
  const modal = byId('result-modal').getAttribute('aria-hidden') === 'false' ? byId('result-modal') :
    expandedEditorState ? byId('editor-modal') : null;
  if (!modal) return;
  const nodes = [...modal.querySelectorAll('button:not(:disabled), textarea, input, [tabindex="0"]')];
  const first = nodes[0];
  const last = nodes[nodes.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
}

function openResult(title, html) {
  if (byId('result-modal').getAttribute('aria-hidden') !== 'false') resultReturnFocus = document.activeElement;
  byId('result-title').textContent = title;
  byId('result-content').innerHTML = html;
  byId('result-modal').classList.remove('!hidden');
  byId('result-modal').setAttribute('aria-hidden', 'false');
  syncModalInert();
  byId('close-result').focus();
}

function closeResult() {
  byId('result-modal').classList.add('!hidden');
  byId('result-modal').setAttribute('aria-hidden', 'true');
  syncModalInert();
  if (resultReturnFocus?.isConnected) resultReturnFocus.focus({ preventScroll: true });
  else byId('copy-title')?.focus({ preventScroll: true });
}

function showCopySheet(title, text, message) {
  openResult(title, '<p id="result-message" class="mt-0 text-sm text-[var(--muted)]" role="status">' + escapeHtml(message) + '</p>' +
    '<textarea id="result-text" readonly class="!min-h-32 !max-h-[50dvh] !text-sm !font-mono" aria-label="可复制内容">' + escapeHtml(text) + '</textarea>' +
    '<div class="mt-3 grid grid-cols-2 gap-2"><button id="select-result">全选</button><button id="copy-result" class="primary">复制</button></div>');
  byId('select-result').addEventListener('click', () => { byId('result-text').focus(); byId('result-text').select(); });
  byId('copy-result').addEventListener('click', () => writeClipboard(text).then(() => {
    byId('result-message').textContent = '已复制';
    toast('已复制');
  }).catch(() => {
    byId('result-message').textContent = '自动复制不可用，已全选，请长按手动复制。';
    byId('result-text').focus();
    byId('result-text').select();
  }));
}

function previewGoal(copy) {
  showCopySheet('完整 Goal 预览', completeGoalText(copy.variables, copy.body), '包含当前参数和执行正文，可直接复制。');
}

function renderFiles(copy) {
  const container = byId('file-list');
  if (!container || currentCopy()?.id !== copy.id) return;
  const files = copy.files ?? [];
  const goals = files.filter(file => file.kind === 'goal').reverse();
  const attachments = files.filter(file => file.kind === 'attachment').reverse();
  const latest = goals[0];
  const state = !latest ? '尚未生成完整 Goal 文件' : latest.revision === (copy.contentRevision ?? 0) ? '最新文件与当前内容一致' : '内容已修改，请重新落盘';
  const rows = (items) => items.map(file => '<div class="mt-3 rounded-xl border border-solid border-[var(--border)] bg-[var(--panel)] p-3">' +
    '<div class="flex items-center gap-2"><strong class="min-w-0 flex-1 break-words text-sm">' + escapeHtml(file.label) + '</strong>' +
    '<button data-copy-file="' + escapeHtml(file.id) + '" class="shrink-0 !text-xs">复制路径</button></div>' +
    '<div class="mt-1 text-xs text-[var(--muted)]">' + escapeHtml(formatUpdated(file.createdAt)) +
    (file.kind === 'goal' ? ' · 版本 ' + (files.filter(item => item.kind === 'goal').findIndex(item => item.id === file.id) + 1) : '') + '</div>' +
    '<p class="mb-0 mt-2 break-all font-mono text-xs text-[var(--muted)]">' + escapeHtml(file.path) + '</p></div>').join('');
  container.innerHTML = '<span class="section-label">文件工作区</span><p class="text-sm text-[var(--accent)]">' + state + '</p>' +
    '<button id="regenerate-goal" class="w-full" ' + (operationCopyId ? 'disabled' : '') + '>生成完整 Goal 新版本</button>' +
    rows(goals) + '<div class="mt-6 flex items-center gap-2"><span class="flex-1 text-sm">引用附件 · ' + attachments.length + '</span><button id="add-attachment" class="!text-xs">新增附件</button></div>' +
    (rows(attachments) || '<p class="text-xs leading-6 text-[var(--muted)]">在长文编辑器中提取选区，或粘贴参考内容生成附件。生成的文件路径可直接复制。</p>') +
    '<p class="mt-4 text-xs text-[var(--muted)]">这里记录本次使用移动视图后生成的文件。已有正文中的路径保持原样。</p>';
  container.querySelectorAll('[data-copy-file]').forEach(button => button.addEventListener('click', () => {
    const file = files.find(item => item.id === button.dataset.copyFile);
    if (file) writeClipboard(file.path).then(() => toast('路径已复制')).catch(() => showCopySheet('复制文件路径', file.path, '可全选后手动复制。'));
  }));
  byId('regenerate-goal').addEventListener('click', () => dumpCompleteGoal(copy));
  byId('add-attachment').addEventListener('click', () => openAttachmentSheet(copy));
}

function openAttachmentSheet(copy) {
  if (operationCopyId) return toast('正在落盘，请稍候');
  openResult('新增参考附件', '<label class="field-label" for="attachment-name">附件名称</label><input id="attachment-name" value="参考资料" maxlength="120" />' +
    '<label class="field-label mt-4" for="attachment-text">粘贴内容</label><textarea id="attachment-text" class="!min-h-48" placeholder="粘贴日志、需求或测试参考…"></textarea>' +
    '<p id="attachment-feedback" class="text-xs text-[var(--muted)]" role="status">生成后可复制路径，粘贴到任意参数中。</p><button id="save-attachment" class="primary w-full">落盘附件</button>');
  byId('save-attachment').addEventListener('click', async () => {
    const text = byId('attachment-text').value;
    if (!text.trim()) { byId('attachment-feedback').textContent = '请先粘贴附件内容。'; return; }
    if (operationCopyId) return;
    const label = byId('attachment-name').value.trim() || '参考资料';
    byId('save-attachment').disabled = true;
    setOperation(copy, true);
    try {
      const path = await writeGoalFile(copy, text);
      addFile(copy, path, 'attachment', label, copy.contentRevision ?? 0);
      lastDumpMessage = '附件已落盘，可复制路径。';
      lastDumpPath = path;
      lastDumpError = false;
      await saveFileMetadata();
      if (byId('attachment-text')) showCopySheet('附件已落盘', path, lastDumpMessage);
      renderDumpFeedback(copy);
    } catch (error) {
      console.error('[GoalBoard] Failed to create attachment:', error);
      const feedback = byId('attachment-feedback');
      if (feedback) feedback.textContent = '落盘失败，内容已保留，可重试：' + (error instanceof Error ? error.message : String(error));
      const button = byId('save-attachment');
      if (button) button.disabled = false;
    } finally {
      setOperation(copy, false);
      renderFiles(copy);
    }
  });
}

function syncViewport() {
  const viewport = window.visualViewport;
  document.body.style.setProperty('--app-height', (viewport?.height ?? window.innerHeight) + 'px');
  document.body.style.setProperty('--app-top', (viewport?.offsetTop ?? 0) + 'px');
}

byId('open-picker').addEventListener('click', () => {
  if (byId('open-picker').getAttribute('aria-expanded') === 'true') closePicker();
  else openPicker();
});
byId('picker-backdrop').addEventListener('click', closePicker);
byId('close-result').addEventListener('click', closeResult);
byId('result-modal').addEventListener('pointerdown', event => { if (event.target === byId('result-modal')) closeResult(); });
byId('mobile-copy').addEventListener('click', () => { const copy = currentCopy(); if (copy) copyCompleteGoal(copy.variables, copy.body); });
byId('mobile-dump').addEventListener('click', () => { const copy = currentCopy(); if (copy) dumpCompleteGoal(copy); });
byId('editor-select-all').addEventListener('click', () => {
  const copy = currentCopy();
  if (!copy || !expandedEditorState) return;
  const editor = byId('expanded-editor');
  editor.focus();
  editor.select();
  rememberSelection(editor, copy, expandedEditorState.target);
});
['editor-dump-selection', 'editor-dump-all'].forEach(id => {
  byId(id).addEventListener('pointerdown', event => event.preventDefault());
  byId(id).addEventListener('click', () => {
    const copy = currentCopy();
    if (copy && expandedEditorState) dumpSelection(copy, byId('expanded-editor'), expandedEditorState.target, id === 'editor-dump-all');
  });
});
byId('editor-undo').addEventListener('click', () => { const copy = currentCopy(); if (copy) undoDumpReplacement(copy); });
document.addEventListener('selectionchange', () => {
  const copy = currentCopy();
  if (copy && expandedEditorState && document.activeElement === byId('expanded-editor')) rememberSelection(byId('expanded-editor'), copy, expandedEditorState.target);
});
statusEl.setAttribute('role', 'button');
statusEl.setAttribute('tabindex', '0');
statusEl.setAttribute('title', '点击立即保存 / 重试保存');
statusEl.addEventListener('click', () => {
  if (!workspaceLoaded) { loadWorkspace(); return; }
  persistNow().catch(() => toast('保存失败，请检查网络后重试'));
});
statusEl.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); statusEl.click(); } });
window.addEventListener('resize', () => { syncViewport(); updateMobileFields(); if (!isMobile()) closePicker(); });
window.visualViewport?.addEventListener('resize', syncViewport);
window.visualViewport?.addEventListener('scroll', syncViewport);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) persistNow().catch(() => undefined); });
syncViewport();

loadWorkspace();
</script>
</body>
</html>
